x-postgres-common: &postgres-common
  image: postgres:17-bookworm
  environment:
    POSTGRES_USER: admin
    POSTGRES_PASSWORD: admin
    POSTGRES_DB: armwrestling-math

services:
  postgres:
    <<: *postgres-common
    volumes:
      - db_fresh:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  # Deprecated (MPI-20): superseded by the `postgres` service above. Retained
  # unmodified so its data is not lost. Not started by `docker-compose up`;
  # start explicitly with: docker compose --profile legacy up postgres-legacy
  postgres-legacy:
    <<: *postgres-common
    profiles: ["legacy"]
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  # Self-hosted transcription (MPI-32): the portable, CPU-only path used by
  # CI. Local dev should prefer the native whisper-server binary (Metal
  # acceleration on Apple Silicon; this container cannot access it) -- start
  # this one explicitly only to exercise the exact path CI runs:
  # docker compose --profile whisper up -d whisper
  whisper:
    profiles: ["whisper"]
    build:
      context: docker/whisper
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db_fresh:
  db:
