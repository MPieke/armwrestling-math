name: Generic Ingestion CI

on:
  pull_request:
    paths:
      - db/**
      - services/importer/**
      - .github/workflows/generic-ingestion-ci.yml
  push:
    branches:
      - main
    paths:
      - db/**
      - services/importer/**
      - .github/workflows/generic-ingestion-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/importer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/importer/go.mod
          cache-dependency-path: services/importer/go.sum

      - name: Check formatting
        run: |
          echo "Checking that every Go file is formatted with gofmt."
          if find . -name '*.go' -type f -exec gofmt -l {} + | grep -q .; then
            echo "Go files require formatting"
            exit 1
          fi
          echo "PASS: all Go files are formatted."

      - name: Vet
        run: |
          echo "Running go vet to detect static correctness issues."
          go vet ./...
          echo "PASS: go vet found no issues."

      - name: List discovered unit tests
        run: |
          echo "Discovering non-tagged tests in every Go package below services/importer."
          echo "The generated dbgen package has no hand-written tests; PostgreSQL integration tests exercise its queries."
          go test -list . ./...

      - name: Run unit tests
        run: |
          echo "Running every discovered non-tagged test with verbose output and no Go result cache."
          go test -v -count=1 ./...
          echo "PASS: all discovered unit tests passed."

      - name: Check sqlc generated code
        run: |
          echo "Installing pinned sqlc v1.30.0 and regenerating the query package."
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          "$(go env GOPATH)/bin/sqlc" generate -f sqlc.yaml
          if ! git diff --quiet -- internal/dbgen; then
            echo "FAIL: generated dbgen code is stale. Commit the regenerated output."
            git diff -- internal/dbgen
            exit 1
          fi
          echo "PASS: committed dbgen output matches the SQL schema and queries."

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: armwrestling_math_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d armwrestling_math_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/importer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/importer/go.mod
          cache-dependency-path: services/importer/go.sum

      - name: Install PostgreSQL client
        run: |
          echo "Installing psql so CI can apply the ingestion migration to its dedicated test database."
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify dedicated PostgreSQL service
        env:
          PGPASSWORD: admin
        run: |
          echo "Verifying that CI is connected only to armwrestling_math_test."
          psql -h 127.0.0.1 -U admin -d armwrestling_math_test \
            -c "select current_database() as integration_database;"

      - name: Apply ingestion migration
        env:
          PGPASSWORD: admin
        run: |
          echo "Applying db/migrations/0001_init.sql to the empty integration database."
          psql -h 127.0.0.1 -U admin -d armwrestling_math_test \
            -v ON_ERROR_STOP=1 -f ../../db/migrations/0001_init.sql
          echo "Created ingestion tables:"
          psql -h 127.0.0.1 -U admin -d armwrestling_math_test -c "\\dt"

      - name: List discovered integration tests
        run: |
          echo "Discovering tests included by the integration build tag in internal/ingest."
          echo "This includes normal validation tests and PostgreSQL tests marked //go:build integration."
          go test -tags integration -list . ./internal/ingest

      - name: Run guarded integration tests
        env:
          INGEST_TEST_DATABASE_URL: postgres://admin:admin@127.0.0.1:5432/armwrestling_math_test?sslmode=disable
        run: |
          echo "Running every discovered integration-tagged test with verbose output and no Go result cache."
          echo "The suite proves complete graph persistence, idempotent replay, transaction rollback, and failed-run recording."
          go test -v -count=1 -tags integration ./internal/ingest
          echo "PASS: generic ingestion behavior is correct against PostgreSQL."
