name: Generic Ingestion CI

on:
  pull_request:
    paths:
      - db/**
      - services/importer/**
      - .github/workflows/generic-ingestion-ci.yml
  push:
    branches:
      - main
    paths:
      - db/**
      - services/importer/**
      - .github/workflows/generic-ingestion-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/importer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/importer/go.mod

      - name: Check formatting
        run: |
          if find . -name '*.go' -type f -exec gofmt -l {} + | grep -q .; then
            echo "Go files require formatting"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./...

      - name: Check sqlc generated code
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          "$(go env GOPATH)/bin/sqlc" generate -f sqlc.yaml
          git diff --exit-code -- internal/dbgen

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: armwrestling_math_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d armwrestling_math_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/importer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/importer/go.mod

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Apply ingestion migration
        env:
          PGPASSWORD: admin
        run: |
          psql -h 127.0.0.1 -U admin -d armwrestling_math_test \
            -v ON_ERROR_STOP=1 -f ../../db/migrations/0001_init.sql

      - name: Run guarded integration test
        env:
          INGEST_TEST_DATABASE_URL: postgres://admin:admin@127.0.0.1:5432/armwrestling_math_test?sslmode=disable
        run: go test -tags integration ./internal/ingest
