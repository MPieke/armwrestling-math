[project]
name = "armwrestling-prediction"
version = "0.1.0"
description = "Elo baseline and rolling-origin evaluation runner for the prediction track."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "choix>=0.4.1",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.4,<0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
markers = [
    "integration: requires a real PostgreSQL database (PREDICTION_TEST_DATABASE_URL)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prediction"]
